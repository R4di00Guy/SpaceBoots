<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Generatingt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>JavaScript Generating</h1></header>

    <main id="mn">
        <div class="container">
            <h3>Product</h3>
            <div id="div1" class="product_img_cont">
                <img class="product_img" src="glhf.png">
            </div>
            <h4>price</h4>
        </div>
        

    </main>
    <footer></footer>
    <script>
        function add_block(){
            const product_id=9; //define how many products it will be 
            const name=new Array; //define array related to product name
            const img_src=new Array; //define array related to product image
            const price=new Array; //define array related to product price

            
            name[0]="Scetchers"; //1st product
            img_src[0]="glhf.png";
            price[0]=340.00;

            
            name[1]="Puma"; //2nd product
            img_src[1]="glhf.png";
            price[1]=570.00;

            
            name[2]="Joma"; //3rd product
            img_src[2]="glhf.png";
            price[2]=320.00;

            for(i=0;i<product_id;i++){ //adding products into html main
                document.getElementById("mn").innerHTML+=`
                <div class="container">
                <h3>`+name[i]+`</h3>
                <div id="div1" class="product_img_cont">
                    <img class="product_img" src="`+img_src[i]+`">
                </div>
                <h4>`+price[i]+` zl</h4>
                </div>
                `}
        }
        add_block();
    </script>
</body>

</html>
